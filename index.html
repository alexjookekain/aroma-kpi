<style>
:root { --bg: #f6f7f9; --panel: #fff; --fg: #1d2330; --muted: #5f6878; --line: #dfe3ea; --accent: #2f6fdb; --bad: #c0392b; }
@media (prefers-color-scheme: dark) { :root { --bg: #12151b; --panel: #1a1f27; --fg: #e8ebf0; --muted: #9aa3b2;
  --line: #2b323d; --accent: #6c9ef8; --bad: #f07167; color-scheme: dark; } }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font-family: "Segoe UI", Arial, sans-serif; }
.wrap { min-height: 100%; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
.box { width: min(100%, 360px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px;
  display: grid; gap: 12px; }
h1 { margin: 0; font-size: 20px; }
p { margin: 0; color: var(--muted); font-size: 14px; }
input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
button { font: inherit; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--bad); font-size: 14px; min-height: 1.2em; }
</style></head><body>

  async function open() {
    if (!pw.value) { err.textContent = 'Введите пароль.'; return; }
    if (!window.crypto || !crypto.subtle) { err.textContent = 'Браузер не поддерживает расшифровку — откройте страницу по https.'; return; }
    go.disabled = true; err.textContent = ''; go.textContent = 'Открываю…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data)));
      document.open(); document.write(html); document.close();
    } catch (e) {
      err.textContent = 'Неверный пароль.'; go.disabled = false; go.textContent = 'Открыть'; pw.select();
    }
  }
  go.addEventListener('click', open);
  pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
})();
</script>
</body></html>
